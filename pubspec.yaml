name: hardwareos
description: "HardwareOS — Multi-Tenant SaaS ERP for Hardware Stores"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_messaging: ^16.7.0

  # Navigation
  go_router: ^18.0.2

  # State management
  provider: ^6.1.2

  # UI & Fonts
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.10+1
  flutter_markdown: ^0.7.4
  pdf: ^3.11.1
  printing: ^5.13.4

  # Utilities
  intl: any
  uuid: ^4.4.2
  collection: ^1.18.0
  shared_preferences: ^2.3.2
  cached_network_image: ^4.0.4
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  firebase_storage: ^13.6.0
  firebase_app_check: ^0.4.8

  # File picking & parsing (Bulk Import)
  file_picker: ^13.1.0
  csv: ^8.0.0
  excel: ^4.0.6

  # Receipt printing
  esc_pos_utils_plus: ^2.0.3
  blue_thermal_printer: ^1.2.3
  print_bluetooth_thermal: ^1.2.5

  # Offline resilience
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.0
  flutter_localizations:
    sdk: flutter
  firebase_crashlytics: ^5.4.0
  web: ^1.1.1
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Noto Sans
      fonts:
        - asset: fonts/NotoSans-Variable.ttf
