name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 1. FLUTTER FRONTEND PIPELINE
  flutter_checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .
        continue-on-error: true # Warning only for now
        
      - name: Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        
      - name: Run Tests
        run: flutter test

      - name: Build Web App
        # Only build on main branch
        if: github.ref == 'refs/heads/main'
        run: flutter build web
        
      - name: Upload Web Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Build Android APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release
        
      - name: Upload Android Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. FIREBASE BACKEND PIPELINE
  backend_checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run TypeScript Compiler (Check)
        run: npm run build
        
      - name: Run Jest Tests
        run: npm test

  # 3. DEPLOYMENT (Only on Main branch after checks pass)
  deploy:
    name: Deploy to Firebase
    needs: [flutter_checks, backend_checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build
        
      - name: Deploy to Firebase (Hosting, Functions, Firestore Rules)
        run: firebase deploy --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive
