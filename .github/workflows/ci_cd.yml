name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. FLUTTER FRONTEND PIPELINE
  flutter_checks:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Web App
        if: github.ref == 'refs/heads/main'
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ secrets.RECAPTCHA_SITE_KEY }}" ]; then
            EXTRA_ARGS="--dart-define=RECAPTCHA_SITE_KEY=${{ secrets.RECAPTCHA_SITE_KEY }}"
          else
            echo "::warning::RECAPTCHA_SITE_KEY secret not set. Web build will not have App Check enabled."
          fi
          flutter build web $EXTRA_ARGS

      - name: Upload Web Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Build Android APK
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Upload Android Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. FIREBASE BACKEND PIPELINE
  backend_checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './functions/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler (Check)
        run: npm run build

      - name: Run Jest Tests
        run: npm test

  # 3. DEPLOYMENT (Only on Main branch after checks pass)
  deploy:
    name: Deploy to Firebase
    needs: [flutter_checks, backend_checks]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Build Functions
        working-directory: ./functions
        run: npm run build

      - name: Prepare deployment credentials
        run: |
          set -e
          echo "Checking deployment secrets..."
          if [ -n "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" ]; then
            echo "Using GOOGLE_APPLICATION_CREDENTIALS from secrets"
            echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" > sa-key.json
            export GOOGLE_APPLICATION_CREDENTIALS="$PWD/sa-key.json"
          else
            if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
              echo "ERROR: Neither GOOGLE_APPLICATION_CREDENTIALS nor FIREBASE_TOKEN is set. Aborting deploy."
              exit 1
            fi
          fi
          if [ -n "${{ secrets.MPESA_WEBHOOK_SECRET }}" ]; then
            printf '%s' "${{ secrets.MPESA_WEBHOOK_SECRET }}" | firebase functions:secrets:set MPESA_WEBHOOK_SECRET --data-file -
            echo "MPESA_WEBHOOK_SECRET synced to Firebase Secret Manager."
          else
            echo "WARNING: MPESA_WEBHOOK_SECRET not found in GitHub secrets. Assuming it is already set in Firebase."
          fi

      - name: Deploy to Firebase (Hosting, Functions, Firestore Rules)
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Deploying using service account credentials..."
            firebase deploy --non-interactive --force
          else
            echo "Deploying using FIREBASE_TOKEN."
            firebase deploy --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive --force
          fi
