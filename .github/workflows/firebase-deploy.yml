name: Build and Deploy
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Cloud Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions (TypeScript)
        working-directory: functions
        run: npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Deploy to Firebase (Hosting & Functions)
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
             firebase deploy --only hosting,functions --non-interactive --force && break
             n=$((n+1))
             echo "::warning::Firebase deploy hit GCP quota limit or failed. Retrying in 15s (Attempt $n/3)..."
             sleep 15
          done
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
