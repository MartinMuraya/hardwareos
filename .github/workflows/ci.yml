name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK (clone stable channel)
        run: |
          # Clone the Flutter stable release and make it available in PATH for this step
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 flutter-sdk
          # Add flutter bin to the runner PATH for subsequent steps
          echo "$GITHUB_WORKSPACE/flutter-sdk/bin" >> $GITHUB_PATH
          # Export PATH for the current shell so flutter is available immediately in this step
          export PATH="$GITHUB_WORKSPACE/flutter-sdk/bin:$PATH"
          flutter --version
          flutter doctor -v
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage

  pre-deploy-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Ensure RECAPTCHA_SITE_KEY secret exists
        run: |
          if [ -z "${{ secrets.RECAPTCHA_SITE_KEY }}" ]; then
            echo "RECAPTCHA_SITE_KEY secret is missing. Aborting deployment checks.";
            exit 1;
          fi
